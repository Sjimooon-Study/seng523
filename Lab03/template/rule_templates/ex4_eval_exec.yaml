rules:
  - id: py-eval-variable
    message: Use of eval with variable (possible code injection)
    severity: WARNING
    languages: [python]
    # Detect eval w/ variable argument
    patterns:
      - pattern: eval(..., $ARG, ...)
      - metavariable-pattern:
          metavariable: $ARG
          patterns:
            - pattern-not: '"..."'
      #- pattern: exec(...)
      #- pattern-not: exec("...")


  - id: py-exec-variable
    message: Use of exec with variable (possible code injection)
    severity: WARNING
    languages: [python]
    # Detect exec w/ variable argument
    patterns:
      - pattern: exec(..., $ARG, ...)
      - metavariable-pattern:
          metavariable: $ARG
          patterns:
            - pattern-not: '"..."'
      #- pattern: exec(...)
      #- pattern-not: exec("...")
