rules:
  - id: py-open-variable
    message: "Potential path traversal: open() called with variable or mixed path"
    severity: WARNING
    languages: [python]
    pattern-either:
      - patterns:
          - pattern: open($ARG, ...)
          - metavariable-pattern:
              metavariable: $ARG
              patterns:
                - pattern-not: '"..."'

  - id: py-join-variable
    message: "Potential path traversal: os.path.join() with variable or mixed input"
    severity: WARNING
    languages: [python]
    pattern-either:
      - patterns:
          - pattern: os.path.join(..., $ARG, ...)
          - metavariable-pattern:
              metavariable: $ARG
              patterns:
                - pattern-not: '"..."'
